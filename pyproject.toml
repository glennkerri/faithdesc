[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glennkerri-faithdesc"
version = "0.1.0"
description = "从样本里推断图像描述的忠实度应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "glennkerri" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://glennkerri.github.io"
Repository = "https://github.com/glennkerri/faithdesc"
Issues = "https://github.com/glennkerri/faithdesc/issues"

[project.scripts]
faithdesc = "faithdesc:main"

[tool.setuptools]
py-modules = ["faithdesc"]
